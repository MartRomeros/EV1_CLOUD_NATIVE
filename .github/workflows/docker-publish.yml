name: Docker Build and Push to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Servicio a compilar y publicar en Docker Hub'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - frontend
          - backend

permissions:
  contents: read

jobs:
  # ========================================================
  # Compilación y publicación del Frontend (Angular 22 + Nginx)
  # ========================================================
  build-frontend:
    name: Build & Push Frontend
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'frontend' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determinar nombre del repositorio de Docker Hub
        id: repo-frontend
        run: |
          REPO="${{ secrets.DOCKERHUB_REPO_FRONTEND }}"
          if [ -z "$REPO" ]; then
            REPO="${{ secrets.DOCKERHUB_USERNAME }}/tallerpro360-frontend"
          elif [[ "$REPO" != *"/"* ]]; then
            REPO="${{ secrets.DOCKERHUB_USERNAME }}/$REPO"
          fi
          echo "image=$REPO" >> $GITHUB_OUTPUT

      - name: Generar metadatos y etiquetas para Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo-frontend.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=sha,format=long

      - name: Compilar y subir imagen de Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # Compilación y publicación del Backend (Node.js + Express API)
  # ========================================================
  build-backend:
    name: Build & Push Backend
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'backend' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determinar nombre del repositorio de Docker Hub
        id: repo-backend
        run: |
          REPO="${{ secrets.DOCKERHUB_REPO_BACKEND }}"
          if [ -z "$REPO" ]; then
            REPO="${{ secrets.DOCKERHUB_USERNAME }}/tallerpro360-backend"
          elif [[ "$REPO" != *"/"* ]]; then
            REPO="${{ secrets.DOCKERHUB_USERNAME }}/$REPO"
          fi
          echo "image=$REPO" >> $GITHUB_OUTPUT

      - name: Generar metadatos y etiquetas para Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo-backend.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=sha,format=long

      - name: Compilar y subir imagen de Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
