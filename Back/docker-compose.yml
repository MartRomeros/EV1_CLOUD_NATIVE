version: '3.8'

services:
  app:
    build: .
    ports:
      - "8085:3000"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=PossGAdmin
      - POSTGRES_DB=DB_CLOUD
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=5432

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=PossGAdmin
      - POSTGRES_DB=DB_CLOUD
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
