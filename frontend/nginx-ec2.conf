# ==============================================================================
# Configuración Nginx para Host EC2 (Ubuntu)
# Dominio: app.martin-romero.cl
# Destino en EC2: /etc/nginx/sites-available/app.martin-romero.cl
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Servidor HTTP (Puerto 80): Redirección obligatoria a HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.martin-romero.cl;

    # Ruta para desafíos de verificación ACME de Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirección permanente 301 hacia HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Servidor HTTPS (Puerto 443): Reverse Proxy hacia el contenedor Docker
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.martin-romero.cl;

    # Certificados SSL generados por Certbot (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/app.martin-romero.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.martin-romero.cl/privkey.pem;

    # Parámetros y protocolos SSL seguros
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs específicos para el sitio
    access_log /var/log/nginx/app.martin-romero.cl.access.log;
    error_log /var/log/nginx/app.martin-romero.cl.error.log warn;

    # Tamaño máximo de subida
    client_max_body_size 20M;

    # Reverse Proxy hacia el contenedor Docker de frontend (mapeado en 127.0.0.1:8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Cabeceras de proxy para preservar IP y protocolo del cliente original
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Soporte para WebSockets / upgrade de conexión si aplica
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts de conexión y lectura
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Optimización de buffers
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
