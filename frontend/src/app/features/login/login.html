<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 text-center" style="width: 100%; max-width: 380px;">
    <h1 class="h4 mb-4">Pedidos360</h1>

    <button
      type="button"
      class="btn btn-outline-secondary d-flex align-items-center justify-content-center gap-2 w-100"
      (click)="onLoginMicrosoft()"
    >
      <svg width="20" height="20" viewBox="0 0 21 21" aria-hidden="true">
        <rect x="1" y="1" width="9" height="9" fill="#f25022" />
        <rect x="11" y="1" width="9" height="9" fill="#7fba00" />
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef" />
        <rect x="11" y="11" width="9" height="9" fill="#ffb900" />
      </svg>
      <span>Iniciar sesión con Microsoft</span>
    </button>

    <button type="button" class="btn btn-link mt-3" (click)="onResetPassword()">
      Restablecer contraseña
    </button>

    @if (mostrarMensajeReset) {
      <ngb-alert type="info" [dismissible]="true" (closed)="mostrarMensajeReset = false">
        Esta función estará disponible cuando se integre Entra ID.
      </ngb-alert>
    }
  </div>
</div>
